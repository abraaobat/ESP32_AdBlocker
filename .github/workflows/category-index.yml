name: Category index validation

on:
  pull_request:
    paths:
      - "data/domain-categories.txt"
      - "scripts/validate_domain_categories.py"
      - ".github/workflows/category-index.yml"
  push:
    paths:
      - "data/domain-categories.txt"
      - "scripts/validate_domain_categories.py"
      - ".github/workflows/category-index.yml"

jobs:
  validate-category-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_domain_categories.py
