<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ESP32 AdBlock Gateway — Devices</title>
  <style>
    :root {
      --bg:#f5f7fb;
      --card:#fff;
      --text:#18212f;
      --muted:#687386;
      --line:#d9e0ea;
      --ok:#16794b;
      --off:#7a8799;
      --accent:#0b68ff;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
    header{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    header a{text-decoration:none;color:var(--accent);font-weight:700}
    main{max-width:980px;margin:0 auto;padding:18px}
    h1{margin:0 0 6px;font-size:1.7rem}
    .lead{color:var(--muted);margin:0 0 18px}
    .summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}
    .metric,.device{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
    .metric small{display:block;color:var(--muted);margin-bottom:4px}.metric strong{font-size:1.5rem}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
    button{border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
    button:disabled{opacity:.55;cursor:default}
    #status{font-size:.9rem;color:var(--muted)}
    .devices{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
    .device-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    .device-title{display:flex;flex-direction:column;gap:2px;min-width:0}
    .device-title strong{overflow-wrap:anywhere}.device-title small{color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .badge{font-size:.78rem;font-weight:800;padding:5px 9px;border-radius:999px;background:#e8edf3;color:var(--off)}
    .badge.online{background:#e6f5ed;color:var(--ok)}
    dl{display:grid;grid-template-columns:110px 1fr;gap:7px 10px;margin:0}
    dt{color:var(--muted)}dd{margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}
    .editor{display:flex;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);align-items:center}
    .editor input,.editor select{flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font:inherit;color:var(--text);background:#fff}
    .editor input:focus,.editor select:focus{outline:2px solid rgba(11,104,255,.18);border-color:var(--accent)}
    .editor button{padding:9px 12px;white-space:nowrap}
    .profile-note{margin-top:8px;color:var(--muted);font-size:.82rem}
    .empty,.error{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;color:var(--muted)}
    .error{color:#9f2d2d;border-color:#e8bcbc;background:#fff7f7}
    @media(max-width:600px){.summary{grid-template-columns:1fr}.device{padding:14px}dl{grid-template-columns:92px 1fr}.editor{flex-direction:column;align-items:stretch}}
  </style>
</head>
<body>
  <header>
    <strong>ESP32 AdBlock Gateway</strong>
    <a href="/">← Back to dashboard</a>
  </header>
  <main>
    <h1>Devices</h1>
    <p class="lead">Live view of devices known by the protected Wi-Fi Device Registry. Friendly names and profile assignments are stored by MAC on the ESP32.</p>

    <section class="summary">
      <div class="metric"><small>Online now</small><strong id="onlineCount">—</strong></div>
      <div class="metric"><small>Known devices</small><strong id="knownCount">—</strong></div>
      <div class="metric"><small>Refresh</small><strong>5s</strong></div>
    </section>

    <div class="toolbar">
      <span id="status">Loading…</span>
      <button id="refreshBtn" type="button">Refresh now</button>
    </div>

    <section id="devices" class="devices"></section>
  </main>

  <script>
    'use strict';

    const onlineCount = document.getElementById('onlineCount');
    const knownCount = document.getElementById('knownCount');
    const devicesEl = document.getElementById('devices');
    const statusEl = document.getElementById('status');
    const refreshBtn = document.getElementById('refreshBtn');

    const defaultProfiles = ['standard', 'iot-strict', 'unrestricted'];
    let availableProfiles = [...defaultProfiles];

    function elapsed(ms) {
      if (!Number.isFinite(ms)) return '—';
      if (ms < 1000) return `${ms} ms`;
      const sec = Math.floor(ms / 1000);
      if (sec < 60) return `${sec}s`;
      const min = Math.floor(sec / 60);
      if (min < 60) return `${min}m ${sec % 60}s`;
      const hr = Math.floor(min / 60);
      return `${hr}h ${min % 60}m`;
    }

    function profileLabel(id) {
      if (id === 'iot-strict') return 'IoT Strict';
      if (id === 'unrestricted') return 'Unrestricted';
      return 'Standard';
    }

    async function saveControl(variable, value, savingLabel, doneLabel) {
      statusEl.textContent = savingLabel;
      const encoded = encodeURIComponent(value);
      const res = await fetch(`/control?${variable}=${encoded}`, {cache:'no-store'});
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      statusEl.textContent = doneLabel;
      await loadDevices(true);
    }

    async function saveName(mac, input, button) {
      const previous = button.textContent;
      button.disabled = true;
      button.textContent = 'Saving…';
      try {
        await saveControl('deviceName', `${mac}|${input.value.trim()}`, 'Saving friendly name…', 'Friendly name saved');
      } catch (err) {
        statusEl.textContent = `Could not save name: ${err.message}`;
      } finally {
        button.disabled = false;
        button.textContent = previous;
      }
    }

    async function saveProfile(mac, select, button) {
      const previous = button.textContent;
      button.disabled = true;
      button.textContent = 'Saving…';
      try {
        await saveControl('deviceProfile', `${mac}|${select.value}`, 'Saving device profile…', 'Device profile saved');
      } catch (err) {
        statusEl.textContent = `Could not save profile: ${err.message}`;
      } finally {
        button.disabled = false;
        button.textContent = previous;
      }
    }

    function deviceCard(d) {
      const article = document.createElement('article');
      article.className = 'device';

      const head = document.createElement('div');
      head.className = 'device-head';
      const titleWrap = document.createElement('div');
      titleWrap.className = 'device-title';
      const title = document.createElement('strong');
      title.textContent = d.name || d.ipv4 || d.mac || 'Unknown device';
      const subtitle = document.createElement('small');
      subtitle.textContent = d.name ? (d.ipv4 || d.mac || '') : '';
      titleWrap.append(title, subtitle);
      const badge = document.createElement('span');
      badge.className = `badge${d.online ? ' online' : ''}`;
      badge.textContent = d.online ? 'ONLINE' : 'OFFLINE';
      head.append(titleWrap, badge);

      const dl = document.createElement('dl');
      const rows = [
        ['MAC', d.mac || '—'],
        ['IPv4', d.ipv4 || 'pending'],
        ['Profile', profileLabel(d.profile || 'standard')],
        ['Connections', String(d.connectCount ?? 0)],
        ['First seen', elapsed(d.firstSeenMs)],
        ['Last seen', elapsed(d.lastSeenMs)]
      ];

      rows.forEach(([k,v]) => {
        const dt = document.createElement('dt');
        const dd = document.createElement('dd');
        dt.textContent = k;
        dd.textContent = v;
        dl.append(dt, dd);
      });

      const nameEditor = document.createElement('div');
      nameEditor.className = 'editor name-editor';
      const input = document.createElement('input');
      input.type = 'text';
      input.maxLength = 32;
      input.placeholder = 'Friendly name';
      input.value = d.name || '';
      input.setAttribute('aria-label', `Friendly name for ${d.mac}`);
      const saveNameButton = document.createElement('button');
      saveNameButton.type = 'button';
      saveNameButton.textContent = 'Save name';
      saveNameButton.addEventListener('click', () => saveName(d.mac, input, saveNameButton));
      input.addEventListener('keydown', event => {
        if (event.key === 'Enter') saveNameButton.click();
      });
      nameEditor.append(input, saveNameButton);

      const profileEditor = document.createElement('div');
      profileEditor.className = 'editor profile-editor';
      const select = document.createElement('select');
      select.setAttribute('aria-label', `Profile for ${d.mac}`);
      availableProfiles.forEach(id => {
        const option = document.createElement('option');
        option.value = id;
        option.textContent = profileLabel(id);
        if ((d.profile || 'standard') === id) option.selected = true;
        select.appendChild(option);
      });
      const saveProfileButton = document.createElement('button');
      saveProfileButton.type = 'button';
      saveProfileButton.textContent = 'Save profile';
      saveProfileButton.addEventListener('click', () => saveProfile(d.mac, select, saveProfileButton));
      profileEditor.append(select, saveProfileButton);

      const note = document.createElement('div');
      note.className = 'profile-note';
      note.textContent = 'Profile assignment is stored now; per-device DNS enforcement is enabled only after F3 policy attribution is validated.';

      article.append(head, dl, nameEditor, profileEditor, note);
      return article;
    }

    async function loadDevices(force = false) {
      if (!force && document.activeElement && document.activeElement.matches('.editor input,.editor select')) return;
      statusEl.textContent = 'Refreshing…';
      try {
        const res = await fetch('/api/devices', {cache:'no-store'});
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        onlineCount.textContent = data.online ?? 0;
        knownCount.textContent = data.known ?? 0;
        devicesEl.replaceChildren();
        if (Array.isArray(data.profiles) && data.profiles.length) availableProfiles = data.profiles;

        const list = Array.isArray(data.devices) ? data.devices : [];
        list.sort((a,b) => Number(b.online) - Number(a.online) || String(a.name || a.ipv4).localeCompare(String(b.name || b.ipv4)));

        if (!list.length) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = 'No devices are known yet. Connect a client to the protected Wi-Fi network.';
          devicesEl.appendChild(empty);
        } else {
          list.forEach(d => devicesEl.appendChild(deviceCard(d)));
        }

        statusEl.textContent = `Updated ${new Date().toLocaleTimeString()}`;
      } catch (err) {
        const error = document.createElement('div');
        error.className = 'error';
        error.textContent = `Could not load /api/devices: ${err.message}`;
        devicesEl.replaceChildren(error);
        statusEl.textContent = 'Update failed';
      }
    }

    refreshBtn.addEventListener('click', () => loadDevices(true));
    loadDevices(true);
    setInterval(loadDevices, 5000);
  </script>
</body>
</html>
